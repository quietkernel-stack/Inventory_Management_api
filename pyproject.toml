[project]
name = "inventory-management-api"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
  "alembic>=1.20.1",
  "fastapi>=0.162.0",
  "psycopg[binary,pool]>=3.3.6",
  "pydantic-settings>=2.16.2",
  "sqlalchemy>=2.1.6",
  "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
test = ["httpx2>=2.16.0", "pytest>=9.2.0", "pytest-cov>=7.1.0"]
dev = [
  "fastapi-cli>=0.0.33",
] # move to the list above if you run `fastapi run` in production
